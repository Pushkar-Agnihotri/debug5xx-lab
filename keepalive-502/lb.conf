# nginx pretending to be a cloud load balancer.
# Like GCP's load balancer, it keeps idle connections to backends open
# for up to 600 seconds and reuses them for new requests.

upstream node   { server node:3000;   keepalive 8; keepalive_timeout 600s; }
upstream python { server python:3000; keepalive 8; keepalive_timeout 600s; }
upstream go     { server go:3000;     keepalive 8; keepalive_timeout 600s; }

server {
    listen 80;

    # Needed for nginx to reuse backend connections.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /node/   { proxy_pass http://node/; }
    location /python/ { proxy_pass http://python/; }
    location /go/     { proxy_pass http://go/; }
}
