# client --> lb (nginx, plays the cloud load balancer) --> node | python | go

services:
  lb:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"
    volumes:
      - ./lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [node, python, go]

  # Real networks add a few milliseconds between the load balancer and the
  # backend. This adds 5ms to the lb's outgoing traffic so the bug shows up
  # on a laptop too.
  latency:
    image: nicolaka/netshoot:v0.14
    network_mode: "service:lb"
    cap_add: [NET_ADMIN]
    command: sh -c "tc qdisc replace dev eth0 root netem delay 5ms && sleep infinity"
    depends_on: [lb]

  node:
    build: ./node
    environment:
      KEEPALIVE_TIMEOUT_MS: ${NODE_KEEPALIVE_TIMEOUT_MS}

  python:
    build: ./python
    environment:
      KEEPALIVE_TIMEOUT_S: ${PYTHON_KEEPALIVE_TIMEOUT_S}

  go:
    build: ./go
    environment:
      IDLE_TIMEOUT: ${GO_IDLE_TIMEOUT}
